name: Equipe Communications
description: 'Équipe Communications Corporation was an Acton, Massachusetts telecommunications
  equipment startup established in 1999 by a group of telecom industry veterans. It designed,
  manufactured, and sold data network switching equipment for large-scale facilities-based carriers
  and service providers — Incumbent Local Exchange Carriers (ILECs), Inter Exchange Carriers (IXCs),
  and international carriers. Its product line comprised the Équipe 3200 Multiservice ATM/MPLS Core
  Data Switch, Évail System Software, ÉvailNet Manager, and Élite LifeCycle service and support. The
  positioning was to let carriers scale an existing ATM core network while offering a gradual,
  low-risk transition path to MPLS. The company raised a $40 million third round in March 2002, was
  awarded the first of 74 patents in February 2002, earned ISO 9001:2000 certification from TÜV
  Management Service in February 2002, signed a sales agent/reseller agreement with Ciena in June 2002
  and a services master agreement with Fujitsu in August 2002, and achieved NEBS certification for the
  É3200 in January 2003. Équipe was a carrier-hardware vendor of the pre-API era: it never published a
  public API, developer portal, SDK, or machine-readable interface. This profile is retained as a
  historical record of the Battery Ventures portfolio and is not an active API provider. NOTE:
  unrelated to equipe.com, a Swedish equestrian show-management software company (see
  x-disambiguation).'
